{% if form.non_field_errors %}<div class="bildirim error">{{ form.non_field_errors|join:" " }}</div>{% endif %}
{% for alan in form %}
<div class="alan{% if alan.errors %} hatali{% endif %}">
  <label for="{{ alan.id_for_label }}">{{ alan.label }}</label>
  {{ alan }}
  {% if alan.help_text %}<small class="yardim">{{ alan.help_text|safe }}</small>{% endif %}
  {% for h in alan.errors %}<small class="hata">{{ h }}</small>{% endfor %}
</div>
{% endfor %}
